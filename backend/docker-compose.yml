services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-floodhelper}
      POSTGRES_USER: ${DB_USER:-floodhelper_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-floodhelper_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floodhelper_user} -d ${DB_NAME:-floodhelper}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"
    deploy:
      resources:
        reservations:
          memory: 256M
    # Thêm phần luu dữ liệu riêng ở đây
    volumes:
      - floodhelper_postgres_data:/var/lib/postgresql/data
    networks:
      - floodhelper_network

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        reservations:
          memory: 128M
    # Thêm phần lưu dữ liệu riêng cho Redis
    volumes:
      - floodhelper_redis_data:/data
    networks:
      - floodhelper_network

networks:
  floodhelper_network:

# Khai báo các Volume định danh riêng biệt ở cuối file
volumes:
  floodhelper_postgres_data:
  floodhelper_redis_data:
